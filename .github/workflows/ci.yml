name: CI

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: '1.26.3'

    - name: Lint
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        version: v2.9.0

    - name: Build
      run: go build -v -o parlay

    - name: Unit tests
      run: go test -v ./...

    - name: Setup BATS
      uses: mig4/setup-bats@v1.2.0
      with:
        bats-version: 1.9.0

    - name: Acceptance tests
      run: bats -r .
